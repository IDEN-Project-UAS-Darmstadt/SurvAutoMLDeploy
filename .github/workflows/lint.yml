name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract conda.yaml from example_model.tgz
        run: |
          mkdir -p model
          tar -xzf example_model.tgz -C model ./conda.yaml

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: model/conda.yaml
          environment-name: ci
          cache-environment: true
          cache-downloads: true
          generate-run-shell: true
          create-args: >-
            ruff
            just
            markdownlint-cli

      - name: Lint
        run: just lint
        shell: micromamba-shell {0}